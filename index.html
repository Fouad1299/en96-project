<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعدين عملة EN96 المستمر</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: radial-gradient(circle, #151515 0%, #050505 100%);
            color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: space-between;
            min-height: 100vh; overflow: hidden;
        }
        .header {
            width: 90%; display: flex; justify-content: space-between;
            align-items: center; margin-top: 15px; padding: 10px 15px;
            background: rgba(255, 215, 0, 0.03);
            border: 1px solid rgba(255, 215, 0, 0.15); border-radius: 12px;
        }
        .user-name { font-weight: bold; color: #ffd700; font-size: 14px; }
        .mining-status { font-size: 11px; color: #00ffcc; margin-top: 2px; }
        
        .balance-container { text-align: center; margin-top: 15px; }
        .balance-title { font-size: 13px; color: #bbb; }
        .main-balance { font-size: 36px; font-weight: bold; color: #fff; margin: 2px 0; }
        
        .mining-section {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; flex-grow: 1;
        }
        .coin-button {
            width: 190px; height: 190px; border-radius: 50%;
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.3), inset 0 0 20px rgba(255, 255, 255, 0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 34px; font-weight: bold; color: #000;
            border: 4px solid #fff; cursor: pointer;
            transition: transform 0.1s ease; user-select: none;
        }
        .coin-button:active { transform: scale(0.94); }
        
        .live-counter {
            margin-top: 15px; font-size: 22px; font-family: monospace;
            color: #00ffcc; background: rgba(0, 0, 0, 0.5);
            padding: 4px 14px; border-radius: 20px;
            border: 1px solid rgba(0, 255, 210, 0.2);
        }
        
        .claim-btn {
            width: 85%; padding: 14px;
            background: linear-gradient(90deg, #ffd700 0%, #ffa500 100%);
            border: none; border-radius: 25px; color: #000;
            font-size: 16px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 165, 0, 0.3);
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="user-name">المعدِّن المحترف</div>
            <div class="mining-status" id="statusText">التعدين السحابي نشط دائمًا 🟢</div>
        </div>
        <div style="color: #ffd700; font-weight: bold; font-size: 12px;">شبكة Stellar</div>
    </div>

    <div class="balance-container">
        <div class="balance-title">إجمالي رصيد EN96 المجمّع</div>
        <div class="main-balance" id="totalBalance">0.0000</div>
    </div>

    <div class="mining-section">
        <div class="coin-button" id="coinBtn">EN96</div>
        <div class="live-counter" id="liveMiner">0.000000</div>
    </div>

    <button class="claim-btn" id="claimBtn">CLAIM NOW</button>

    <script>
        const miningSpeedPerSecond = 0.0005; 

        let totalBalance = parseFloat(localStorage.getItem('en96_real_balance')) || 0.0000;
        let lastClaimTime = parseInt(localStorage.getItem('en96_last_time')) || Date.now();
        let currentMining = 0.000000;

        document.getElementById('totalBalance').innerText = totalBalance.toFixed(4);

        function calculateOfflineMining() {
            const now = Date.now();
            const secondsPassed = Math.floor((now - lastClaimTime) / 1000);
            currentMining = secondsPassed * miningSpeedPerSecond;
            document.getElementById('liveMiner').innerText = currentMining.toFixed(6);
        }

        calculateOfflineMining();

        setInterval(() => {
            currentMining += miningSpeedPerSecond;
            document.getElementById('liveMiner').innerText = currentMining.toFixed(6);
        }, 1000);

        document.getElementById('coinBtn').addEventListener('click', () => {
            currentMining += 0.005;
            document.getElementById('liveMiner').innerText = currentMining.toFixed(6);
        });

        document.getElementById('claimBtn').addEventListener('click', () => {
            if (currentMining > 0) {
                totalBalance += currentMining;
                document.getElementById('totalBalance').innerText = totalBalance.toFixed(4);
                lastClaimTime = Date.now();
                localStorage.setItem('en96_real_balance', totalBalance);
                localStorage.setItem('en96_last_time', lastClaimTime);
                currentMining = 0.000000;
                document.getElementById('liveMiner').innerText = currentMining.toFixed(6);
                alert('تم جمع عملات EN96 بنجاح! التعدين مستمر الآن حتى لو أغلقت هاتفك.');
            }
        });
    </script>
</body>
</html>
